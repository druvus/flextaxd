[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flextaxd"
version = "0.5.0"
description = "Flexible modification of taxonomy databases for improved sequence classification"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "David Sundell", email = "david.sundell@foi.se"},
]
maintainers = [
    {name = "FOI bioinformatics group", email = "bioinformatics@foi.se"},
]
keywords = ["taxonomy", "NCBI", "CanSNPer", "customization", "GTDB", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "inquirer>=3.0.0",
]

[project.optional-dependencies]
# Visualization dependencies for tree plotting and advanced output formats
visualization = [
    "biopython>=1.80",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "hypothesis>=6.0",
    "bandit>=1.7",
    "memory-profiler>=0.60",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]
download = [
    "ncbi-genome-download>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/FOI-Bioinformatics/flextaxd"
Repository = "https://github.com/FOI-Bioinformatics/flextaxd"
Issues = "https://github.com/FOI-Bioinformatics/flextaxd/issues"
Documentation = "https://github.com/FOI-Bioinformatics/flextaxd/wiki"

[project.scripts]
flextaxd = "flextaxd.cli.main:main"

[tool.hatch.version]
path = "flextaxd/__init__.py"

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "S",  # flake8-bandit (security)
]
ignore = [
    "S603", # subprocess-without-shell-equals-true (we'll fix these)
    "S607", # start-process-with-partial-path (we'll review these)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"] # Allow assert statements in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
# Strict mode
strict = true
# Show error codes
show_error_codes = true
# Additional strict checks
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
warn_incomplete_stub = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --strict-config --cov=flextaxd --cov-report=term-missing"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["flextaxd"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B404", "B603"]  # Allow subprocess usage in our controlled utility functions
[tool.bandit.assert_used]
skips = ["*test*.py", "*/*test*.py"]